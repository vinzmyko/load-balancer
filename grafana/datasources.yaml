apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://host.docker.internal:9090

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus

  - name: Loki
    type: loki
    url: http://loki:3100
